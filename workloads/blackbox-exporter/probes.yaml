  namespace: observability
spec:
  jobName: blackbox-qdevice
  interval: 60s
  module: tcp_connect
  prober:
    url: blackbox-exporter.observability.svc:9115
  targets:
    staticConfig:
      static:
        - 192.168.9.6:5403
