# i have to put it here since argocd is installed manually and not via helm
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: shared
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - argocd.lab.cabral.net.ar
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
