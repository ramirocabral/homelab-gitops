apiVersion: v1
kind: ConfigMap
metadata:
  name: event-exporter
  namespace: observability
data:
  config.yaml: |
    logLevel: warn
    logFormat: json
    maxEventAgeSeconds: 60
    metricsNamePrefix: event_exporter_
    route:
      routes:
        - match:
            - receiver: stdout
    receivers:
      - name: stdout
        stdout:
          deDot: true
