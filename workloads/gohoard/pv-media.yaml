apiVersion: v1
kind: PersistentVolume
metadata:
  name: gohoard-media-nfs
spec:
  capacity:
    storage: 1Ti # NFS ignores it
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
  nfs:
    server: 192.168.9.5
    path: /mnt/main/personal/ramiro/library
  claimRef:
    namespace: gohoard
    name: gohoard-media
