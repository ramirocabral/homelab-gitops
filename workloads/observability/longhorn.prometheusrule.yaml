apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn
  namespace: observability
spec:
  groups:
    - name: longhorn
      interval: 60s
      rules:
        - alert: LonghornVolumeStatusCritical
          expr: longhorn_volume_robustness{state="faulted"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is Faulted'
            description: 'Volume {{ $labels.volume }} has been Faulted for over 5m on {{ $labels.node }}: no usable replica, the workload cannot write.'

        - alert: LonghornVolumeStatusWarning
          expr: longhorn_volume_robustness{state="degraded"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is Degraded'
            description: 'Volume {{ $labels.volume }} has been Degraded for over 5m on {{ $labels.node }}: running with fewer replicas than requested.'

        - alert: LonghornBackupFailed
          expr: longhorn_backup_state == 4
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'Longhorn backup failed for volume {{ $labels.volume }}'
            description: 'Backup {{ $labels.backup }} from recurring job {{ $labels.recurring_job }} ended in Error.'

        # si el recurring job ni siquiera corre no hay Backup en Error que detectar.
        - alert: LonghornBackupStale
          expr: (time() - longhorn_volume_last_backup_at) > 26 * 3600 and longhorn_volume_last_backup_at > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'No backup of {{ $labels.pvc_namespace }}/{{ $labels.pvc }} in over 26h'
            description: 'Last successful backup was {{ $value | humanizeDuration }} ago; backup-daily runs at 06:00 UTC.'

        - alert: LonghornDiskNotSchedulable
          expr: longhorn_disk_status{condition="schedulable"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Longhorn disk {{ $labels.disk }} on {{ $labels.node }} is not schedulable'
            description: 'Longhorn stopped scheduling replicas on this disk: no reservable space or over-provisioning at its limit. Rebuilds fail before the filesystem fills up.'
