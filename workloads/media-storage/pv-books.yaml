apiVersion: v1
kind: PersistentVolume
metadata:
  name: books-data-nfs
spec:
  capacity:
    storage: 100Gi # NFS ignores it
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
  nfs:
    server: 192.168.9.5
    path: /mnt/main/personal/ramiro/books
  claimRef:
    namespace: media
    name: books-data
