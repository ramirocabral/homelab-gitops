apiVersion: v1
kind: ConfigMap
metadata:
  name: bookmarks-config
  namespace: bookmarks
data:
  config.yml: |
    address: 0.0.0.0
    port: 6065
    directory: /data
    permissions: CRUD
    behindProxy: true
    log:
      format: json
      colors: false
    users:
      - username: "{env}WEBDAV_USERNAME"
        password: "{env}WEBDAV_PASSWORD"
