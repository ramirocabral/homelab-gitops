apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: shared
    annotations:
      lbipam.cilium.io/ips: 192.168.9.240
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.cabral.net.ar"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-lab-tls
      allowedRoutes:
        namespaces:
          from: All
