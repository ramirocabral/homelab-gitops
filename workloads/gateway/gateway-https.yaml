apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.cabral.net.ar"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-lab-tls
      allowedRoutes:
        namespaces:
          from: All
  addresses:
    - type: IPAddress
      value: 192.168.90.1 # we use a fixed address for the gateway, so we can point our DNS to it.
