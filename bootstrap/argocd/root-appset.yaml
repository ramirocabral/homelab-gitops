# Root ApplicationSet
#
# It uses a git *directory generator*: it scans apps/* in this repo and creates
# one Argo CD Application per subdirectory automatically.
#
# Each apps/<name>/ folder is any unit Argo understands natively: plain manifests,
# a kustomization.yaml, or a Helm chart (Chart.yaml + values.yaml, incl. an
# umbrella chart that depends on an upstream chart).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/ramirocabral/homelab-gitops.git
        revision: main
        directories:
          - path: apps/*
  template:
    metadata:
      name: "{{.path.basename}}"          # app name = folder name
    spec:
      project: default
      source:
        repoURL: https://github.com/ramirocabral/homelab-gitops.git
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"    # each app in its own namespace
      syncPolicy:
        automated:
          prune: false                      # delete the folder -> app is removed
          selfHeal: true                   # revert manual drift back to git
        syncOptions:
          - CreateNamespace=true           # create the destination namespace
