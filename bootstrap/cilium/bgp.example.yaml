apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: homelab
spec:
  nodeSelector:
    matchLabels: {}            # todos los nodos peerean con el MikroTik
  bgpInstances:
    - name: instance-65001
      localASN: 65001          # ASN del cluster
      peers:
        - name: mikrotik
          peerASN: 65000       # ASN del MikroTik
          peerAddress: 192.168.9.1  # ip Mikrotik
          peerConfigRef:
            name: mikrotik-peer
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: mikrotik-peer
spec:
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp       # toma los Advertisement con esta label
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: lb-services
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP     # anuncia solo la VIP del Service
      selector:
        matchExpressions:
          - { key: somekey, operator: NotIn, values: [never-used] }  # todos los Services
