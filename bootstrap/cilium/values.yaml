# Cilium as the CNI (flannel + kube-proxy disabled in k3s).
kubeProxyReplacement: true
k8sServiceHost: 192.168.9.21 # since no kube-proxy, Cilium needs to know the k8s API server address to watch for Services and Endpoints.
k8sServicePort: 6443

ipam:
  mode: kubernetes        # pod CIDR per node comes from the k8s Node object

operator:
  replicas: 1

l2announcements:
  enabled: true

# linkerd: el socket LB resuelve el ClusterIP antes de que el proxy vea el Service
socketLB:
  hostNamespaceOnly: true

k8sClientRateLimit:
  qps: 50
  burst: 100

# since all my nodes are on the same L2, i can use native routing (no encapsulation) and let cilium install direct routes to the podCIDRs on each node.
# pod-to-pod traffic between nodes is routed as-is, the packet keeps the real pod IP as destination (e.g. 10.42.2.8:1234), without VXLAN wrapper.
# if nodes were on different L2 segments none of this works: i would need encapsulation (or BGP for the podCIDRs), and the VIPs would have to go back to being routed instead of ARP-announced.
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.42.0.0/16   # k3s default pod CIDR
