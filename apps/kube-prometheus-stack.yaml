apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.3.0
      helm:
        valueFiles:
          - $repo/values/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/ramirocabral/homelab-gitops.git
      targetRevision: main
      ref: repo
    - repoURL: https://github.com/ramirocabral/homelab-gitops.git
      targetRevision: main
      path: workloads/observability
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # las CRDs del operator superan el limite de anotaciones de kubectl apply
    automated:
      prune: true
      selfHeal: true
