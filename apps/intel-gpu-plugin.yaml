apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intel-gpu-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ramirocabral/homelab-gitops.git
    targetRevision: main
    path: workloads/intel-gpu-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: intel-device-plugins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
