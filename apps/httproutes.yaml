apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: httproutes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ramirocabral/homelab-gitops.git
    targetRevision: main
    path: workloads/httproutes
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
