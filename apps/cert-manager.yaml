apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://quay.io/jetstack/charts
      chart: cert-manager
      targetRevision: v1.21.1
      helm:
        valueFiles:
          - $repo/values/cert-manager/values.yaml
    - repoURL: https://github.com/ramirocabral/homelab-gitops.git
      targetRevision: main
      ref: repo
    - repoURL: https://github.com/ramirocabral/homelab-gitops.git
      targetRevision: main
      path: workloads/cert-manager
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
