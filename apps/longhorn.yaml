apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  project: default
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: v1.12.0
      helm:
        valueFiles:
          - $repo/values/longhorn/values.yaml
    - repoURL: https://github.com/ramirocabral/homelab-gitops.git
      targetRevision: main
      ref: repo
    - repoURL: https://github.com/ramirocabral/homelab-gitops.git
      targetRevision: main
      path: workloads/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
