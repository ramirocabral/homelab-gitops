controllers:
  calibre-web-automated:
    type: deployment
    strategy: Recreate
    containers:
      calibre-web-automated:
        image:
          repository: crocodilestick/calibre-web-automated
          tag: "v4.0.8"
          pullPolicy: IfNotPresent
        env:
          PUID: "3000"
          PGID: "3000"
          TZ: America/Argentina/Buenos_Aires
          NETWORK_SHARE_MODE: "true"
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /login
                port: 8083
              periodSeconds: 30
              timeoutSeconds: 3
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /login
                port: 8083
              periodSeconds: 10
              failureThreshold: 30
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            memory: 2Gi

service:
  app:
    controller: calibre-web-automated
    ports:
      http:
        port: 8083

route:
  app:
    hostnames:
      - books.lab.cabral.net.ar
    parentRefs:
      - name: shared
        namespace: envoy-gateway-system
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: 8083

persistence:
  config:
    existingClaim: calibre-web-automated-config
    globalMounts:
      - path: /config
  books:
    existingClaim: books-data
    globalMounts:
      - path: /calibre-library
        subPath: library
      - path: /cwa-book-ingest
        subPath: ingest
