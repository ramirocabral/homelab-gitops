image:
  tag: 1.0.1

auth:
  existingSecret: gohoard-secret

config:
  logFormat: json
  maxConcurrentDownloads: 2
  checkInterval: 1h

persistence:
  data:
    enabled: true
    storageClass: single-rwo
    size: 5Gi
  media:
    enabled: true
    existingClaim: gohoard-media

httpRoute:
  enabled: true
  hostnames:
    - gohoard.lab.cabral.net.ar
  parentRefs:
    - name: shared
      namespace: envoy-gateway-system
      sectionName: https

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 3000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsUser: 3000
  runAsGroup: 3000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 2Gi
