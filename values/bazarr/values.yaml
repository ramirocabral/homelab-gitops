controllers:
  bazarr:
    type: deployment
    strategy: Recreate
    initContainers:
      wait-arr:
        image:
          repository: lscr.io/linuxserver/bazarr
          tag: "1.6.0"
          pullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            for i in $(seq 60); do
              wget -q -T 3 -O /dev/null http://radarr:7878/ping &&
                wget -q -T 3 -O /dev/null http://sonarr:8989/ping && exit 0
              sleep 5
            done
            echo "radarr/sonarr not ready, starting anyway"
    containers:
      bazarr:
        image:
          repository: lscr.io/linuxserver/bazarr
          tag: "1.6.0"
          pullPolicy: IfNotPresent
        env:
          PUID: "3000"
          PGID: "3000"
          TZ: America/Argentina/Buenos_Aires
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: bazarr
    ports:
      http:
        port: 6767

route:
  app:
    hostnames:
      - bazarr.lab.cabral.net.ar
    parentRefs:
      - name: shared
        namespace: envoy-gateway-system
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: 6767

persistence:
  config:
    existingClaim: bazarr-config
    globalMounts:
      - path: /config
  data:
    existingClaim: media-data
    globalMounts:
      - path: /data
