controllers:
  bazarr:
    type: deployment
    strategy: Recreate
    containers:
      bazarr:
        image:
          repository: lscr.io/linuxserver/bazarr
          tag: "1.6.0"
          pullPolicy: IfNotPresent
        env:
          PUID: "3000"
          PGID: "3000"
          TZ: America/Argentina/Buenos_Aires
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi

service:
  app:
    controller: bazarr
    ports:
      http:
        port: 6767

route:
  app:
    hostnames:
      - bazarr.lab.cabral.net.ar
    parentRefs:
      - name: shared
        namespace: envoy-gateway-system
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: 6767

persistence:
  config:
    existingClaim: bazarr-config
    globalMounts:
      - path: /config
  data:
    existingClaim: media-data
    globalMounts:
      - path: /data
