loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    bucketNames:
      chunks: loki
      ruler: loki
    s3:
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION}
      accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true

  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 30d

  compactor:
    retention_enabled: true
    delete_request_store: s3

  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  sidecar: false
  extraEnvFrom:
    - secretRef:
        name: loki-s3
  persistence:
    storageClass: single-rwo-nobackup
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
