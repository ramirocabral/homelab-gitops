# qBittorrent (download client). Saves to /data/torrents on the shared NFS tree
# so radarr/sonarr can hardlink into /data/media and the torrent keeps seeding.
controllers:
  qbittorrent:
    type: deployment
    strategy: Recreate
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: "5.2.3"
          pullPolicy: IfNotPresent
        env:
          PUID: "1000"
          PGID: "100"
          TZ: America/Argentina/Buenos_Aires
          WEBUI_PORT: "8080"
        resources:
          requests:
            cpu: 25m
            memory: 256Mi
          limits:
            memory: 2Gi

service:
  # WebUI, exposed through the shared gateway.
  app:
    controller: qbittorrent
    ports:
      http:
        port: 8080
  # Torrenting port. LoadBalancer (Cilium BGP VIP) for inbound peer connections
  # on the LAN. Optional: nothing is exposed to the internet, so this only helps
  # LAN peers / a future router port-forward. Remove if you don't want the VIP.
  bittorrent:
    controller: qbittorrent
    type: LoadBalancer
    ports:
      bt-tcp:
        port: 6881
        protocol: TCP
      bt-udp:
        port: 6881
        protocol: UDP

route:
  app:
    hostnames:
      - qbittorrent.lab.cabral.net.ar
    parentRefs:
      - name: shared
        namespace: envoy-gateway-system
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: 8080

persistence:
  config:
    existingClaim: qbittorrent-config
    globalMounts:
      - path: /config
  data:
    existingClaim: media-data
    globalMounts:
      - path: /data
