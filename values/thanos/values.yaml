# Usa el SealedSecret que ya vive en workloads/observability/
objstoreConfig:
  create: false
  name: thanos-objstore
  key: objstore.yml

# sirve las ultimas ~2h que todavia no subieron al bucket
additionalEndpoints:
  - dnssrv+_grpc._tcp.kube-prometheus-stack-thanos-discovery.observability.svc.cluster.local

additionalReplicaLabels:
  - prometheus_replica

serviceMonitor:
  enabled: true

query:
  replicas: 1
  httpRoute:
    enabled: true
    parentRefs:
      - name: shared
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - "thanos.lab.cabral.net.ar"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

storeGateway:
  replicas: 1
  persistence:
    enabled: true
    storageClass: single-rwo
    size: 8Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi

compact:
  enabled: true
  deduplication:
    enabled: false
  extraArgs:
    - --retention.resolution-raw=30d
    - --retention.resolution-5m=1y
    - --retention.resolution-1h=0d   # 0 = para siempre
    - --compact.concurrency=1        # 1 sola tarea a la vez, el CPU es escaso
    - --downsample.concurrency=1
  persistence:
    enabled: true
    storageClass: single-rwo   # scratch para bajar, procesar y volver a subir bloques
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
