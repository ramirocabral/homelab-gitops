controllers:
  prowlarr:
    type: deployment
    strategy: Recreate
    containers:
      prowlarr:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: "2.5.2"
          pullPolicy: IfNotPresent
        env:
          PUID: "3000"
          PGID: "3000"
          TZ: America/Argentina/Buenos_Aires
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi

service:
  app:
    controller: prowlarr
    ports:
      http:
        port: 9696

route:
  app:
    hostnames:
      - prowlarr.lab.cabral.net.ar
    parentRefs:
      - name: shared
        namespace: envoy-gateway-system
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: 9696

persistence:
  config:
    existingClaim: prowlarr-config
    globalMounts:
      - path: /config
