controllers:
  seerr:
    type: deployment
    strategy: Recreate
    containers:
      seerr:
        image:
          repository: ghcr.io/seerr-team/seerr
          tag: "v3.5.1"
          pullPolicy: IfNotPresent
        env:
          TZ: America/Argentina/Buenos_Aires
          PORT: "5055"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/settings/public
                port: 5055
              periodSeconds: 15
              timeoutSeconds: 3
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/settings/public
                port: 5055
              periodSeconds: 5
              failureThreshold: 30
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 1Gi

defaultPodOptions:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000

service:
  app:
    controller: seerr
    ports:
      http:
        port: 5055

route:
  app:
    hostnames:
      - seerr.lab.cabral.net.ar
    parentRefs:
      - name: shared
        namespace: envoy-gateway-system
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: 5055

persistence:
  config:
    existingClaim: seerr-config
    globalMounts:
      - path: /app/config
