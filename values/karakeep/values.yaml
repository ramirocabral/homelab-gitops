controllers:
  karakeep:
    type: deployment
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/karakeep-app/karakeep
          tag: "0.33.2"
          pullPolicy: IfNotPresent
        env:
          DATA_DIR: /data
          NEXTAUTH_URL: https://karakeep.lab.cabral.net.ar
          MEILI_ADDR: http://karakeep-meilisearch:7700
          BROWSER_WEB_URL: http://karakeep-chrome:9222
          TZ: America/Argentina/Buenos_Aires
          # Pasar a "rue una vez creado el primer usuario (el primero es admin).
          DISABLE_SIGNUPS: "false"
          INFERENCE_TEXT_MODEL: gpt-4o-mini
          INFERENCE_IMAGE_MODEL: gpt-4o-mini
        envFrom:
          - secretRef:
              name: karakeep-secrets
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 3000
              initialDelaySeconds: 30
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 3000
              initialDelaySeconds: 15
              periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

  meilisearch:
    type: deployment
    strategy: Recreate
    containers:
      app:
        image:
          repository: getmeili/meilisearch
          tag: "v1.41.0"
          pullPolicy: IfNotPresent
        env:
          MEILI_ENV: production
          MEILI_NO_ANALYTICS: "true"
        envFrom:
          - secretRef:
              name: karakeep-secrets
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi

  chrome:
    type: deployment
    containers:
      app:
        image:
          repository: ghcr.io/karakeep-app/karakeep-chrome
          tag: "151.0.7922.47-r1"
          pullPolicy: IfNotPresent
        args:
          - --disable-gpu
          - --disable-dev-shm-usage
          - --hide-scrollbars
          - --disable-blink-features=AutomationControlled
          - --window-size=1440,900
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

service:
  karakeep:
    controller: karakeep
    ports:
      http:
        port: 3000
  meilisearch:
    controller: meilisearch
    ports:
      http:
        port: 7700
  chrome:
    controller: chrome
    ports:
      http:
        port: 9222

route:
  karakeep:
    hostnames:
      - karakeep.lab.cabral.net.ar
    parentRefs:
      - name: shared
        namespace: envoy-gateway-system
        sectionName: https
    rules:
      - backendRefs:
          - identifier: karakeep
            port: 3000

persistence:
  data:
    existingClaim: karakeep-data
    advancedMounts:
      karakeep:
        app:
          - path: /data
  meili:
    existingClaim: karakeep-meilisearch
    advancedMounts:
      meilisearch:
        app:
          - path: /meili_data
